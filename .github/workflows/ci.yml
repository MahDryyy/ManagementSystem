name: CI

on:
  push:
    branches: [main, develop, Development]
  pull_request:
    branches: [main, develop, Development]

jobs:
  # ======================== BACKEND ========================
  backend:
    name: Go Test & Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: BackEnd/go.mod
          cache-dependency-path: BackEnd/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -cover -count=1 ./...

  # ======================== FRONTEND ========================
  frontend:
    name: Next.js Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd/my-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FrontEnd/my-app/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
